[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/cne-plan/:proceso/:formulario/:plan"
  to = "https://backend-apps.cne.gob.ec/vi/api/Catalogos/PlanTrabajo/:proceso/:formulario/:plan"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
